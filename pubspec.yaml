name: debt_destroyer
description: "Compare debt payoff strategies and plan your way to debt freedom."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  app_tracking_transparency: ^2.0.7
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  excel: ^4.0.6
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  google_mobile_ads: ^9.1.0
  intl: ^0.20.3
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  payoff_engine:
    path: packages/payoff_engine
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  riverpod_generator: ^4.0.9
  shared_preferences_platform_interface: ^2.4.2
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: BricolageGrotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
